version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spt_user
      POSTGRES_PASSWORD: spt_password
      POSTGRES_DB: spt_hrms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spt_user -d spt_hrms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (session / future jobs) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: spt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spt_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://spt_user:spt_password@postgres:5432/spt_hrms
      SYNC_DATABASE_URL: postgresql://spt_user:spt_password@postgres:5432/spt_hrms
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-hrms}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-please}
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000,http://127.0.0.1:3000
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/start.sh

  # ─── Next.js Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spt_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_NAME: SPT Hospital HRMS
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
